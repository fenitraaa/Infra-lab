apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: preserve-api-weighted
  namespace: {{ .Release.Namespace }}
spec:
  weighted:
    services:
    - name: preserve-api-stable
      port: 8080
      weight: {{ .Values.stable.weight }}
    - name: preserve-api-canary
      port: 8080
      weight: {{ .Values.canary.weight }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: preserve-api
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - web
    - websecure
  routes:
  - match: PathPrefix(`/`)
    kind: Rule
    services:
    - name: preserve-api-weighted
      kind: TraefikService 
  tls:
    secretName: preserve-api-tls
