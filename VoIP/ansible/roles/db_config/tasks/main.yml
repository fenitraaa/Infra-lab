---
- name: Install postgresql
  ansible.builtin.apt:
    name:
      - postgresql
      - postgresql-contrib
      - python3-psycopg2
    state: present
    update_cache: true

- name: Create a2billing user
  community.postgresql.postgresql_user:
    name: "{{ a2billing_dbuser }}"
    password: "{{ a2billing_pwd }}"
    login_user: postgres
  become: true
  become_user: postgres

- name: Create the database
  community.postgresql.postgresql_db:
    name: a2billing
    owner: "{{ a2billing_dbuser }}"
    login_user: postgres
  become: true
  become_user: postgres

- name: Copy sql file to tmp directory
  ansible.builtin.copy:
    src: a2billing.sql
    dest: /tmp/
  changed_when: false

- name: Import a2billing database
  ansible.builtin.command:
    cmd: psql --username=postgres --dbname=a2billing --file=/tmp/a2billing.sql
  become: true
  become_user: postgres

- name: Alter public schema to the a2billing user
  community.postgresql.postgresql_schema:
    db: a2billing
    name: public
    login_user: postgres
    owner: "{{ a2billing_dbuser }}"
  become: true
  become_user: postgres

- name: Grant privilege on database to the a2billing user
  community.postgresql.postgresql_privs:
    db: a2billing
    privs: ALL
    type: database
    obj: a2billing
    role: "{{ a2billing_dbuser }}"
    login_user: postgres
  become: true
  become_user: postgres

- name: Grant privilege on tables to the a2billing user
  community.postgresql.postgresql_privs:
    db: a2billing
    privs: ALL
    type: table
    obj: ALL_IN_SCHEMA
    schema: public
    role: "{{ a2billing_dbuser }}"
    login_user: postgres
  become: true
  become_user: postgres

- name: Grant privilege on sequences to the a2billing user
  community.postgresql.postgresql_privs:
    db: a2billing
    privs: ALL
    type: sequence
    obj: ALL_IN_SCHEMA
    schema: public
    role: "{{ a2billing_dbuser }}"
    login_user: postgres
  become: true
  become_user: postgres

- name: Grant privilege on functions to the a2billing user
  community.postgresql.postgresql_privs:
    db: a2billing
    privs: ALL
    type: function
    obj: ALL_IN_SCHEMA
    schema: public
    role: "{{ a2billing_dbuser }}"
    login_user: postgres
  become: true
  become_user: postgres

- name: Allow connection from the private network
  ansible.builtin.lineinfile:
    path: /etc/postgresql/15/main/pg_hba.conf
    line: 'host    a2billing    a2billing_dbuser    192.168.10.0/24    scram-sha-256'
  become: true
  notify: Restart postgres

- name: Allow all addresses to listen on
  ansible.builtin.lineinfile:
    path: /etc/postgresql/15/main/postgresql.conf
    line: "listen_addresses = '*'"
  become: true
  notify: Restart postgres

