---
all:
  vars:
    ansible_become: true
    ansible_become_method: sudo
    ansible_user: vagrant
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

  children:
    asterisk:
      hosts:
        asterisk-lab:
          ansible_host: 192.168.10.10
          ansible_ssh_private_key_file: ../.vagrant/machines/asterisk/vmware_desktop/private_key
    vpn-gateway:
      hosts:
        vpn-gateway-lab:
          ansible_host: 192.168.10.40
          ansible_ssh_private_key_file: ../.vagrant/machines/vpn-gateway/vmware_desktop/private_key
    a2billing:
      hosts:
        a2billing-lab:
          ansible_host: 192.168.10.20
          ansible_ssh_private_key_file: ../.vagrant/machines/a2billing/vmware_desktop/private_key
    db:
      hosts:
        db-lab:
          ansible_host: 192.168.10.30
          ansible_ssh_private_key_file: ../.vagrant/machines/db/vmware_desktop/private_key

