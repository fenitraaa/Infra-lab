---
- name: Install and Config Asterisk
  hosts: asterisk-lab
  become: true
  gather_facts: false
  roles:
    - role: asterisk_installation
      tags: asterisk_installation
    - role: config_asterisk
      tags: config_asterisk

- name: Configuration of the wireguard server
  hosts: vpn-gateway-lab
  become: true
  gather_facts: false
  roles:
    - role: config_vpn
      tags: config_vpn

- name: Database configuration
  hosts: db-lab
  become: true
  gather_facts: false
  roles:
    - role: db_config
      tags: db_config

