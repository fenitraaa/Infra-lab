---
- name: Install smartmontools
  ansible.builtin.apt:
    name: smartmontools
    state: present
    update_cache: true

- name: Create user service for node_exporter
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Download and extract node_exporter
  ansible.builtin.unarchive:
    src: "https://github.com/prometheus/node_exporter/releases/download/v1.8.2/node_exporter-1.8.2.linux-amd64.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/node_exporter-1.8.2.linux-amd64"

- name: Install binary node_exporter
  ansible.builtin.copy:
    src: "/tmp/node_exporter-1.8.2.linux-amd64/node_exporter"
    dest: /usr/local/bin/node_exporter
    mode: '0755'
    remote_src: true

- name: Create directory textfile_collector
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile_collector
    state: directory
    owner: node_exporter
    group: node_exporter
    mode: '0755'

- name: Deploy the service node_exporter
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: '0644'
  notify: reload and restart node_exporter

- name: Deploy the script smart_metrics.sh
  ansible.builtin.template:
    src: smart_metrics.sh.j2
    dest: /usr/local/bin/smart_metrics.sh
    mode: '0755'

- name: Deploy the service smart-metrics
  ansible.builtin.template:
    src: smart-metrics.service.j2
    dest: /etc/systemd/system/smart-metrics.service
    mode: '0644'
  notify: reload systemd

- name: Deploy the timer smart-metrics
  ansible.builtin.template:
    src: smart-metrics.timer.j2
    dest: /etc/systemd/system/smart-metrics.timer
    mode: '0644'
  notify: reload systemd

- name: Enable and restart node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true

- name: Enable and restart smart-metrics.timer
  ansible.builtin.systemd:
    name: smart-metrics.timer
    enabled: true
    state: started
    daemon_reload: true
